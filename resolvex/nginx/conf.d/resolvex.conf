# ResolveX public reverse proxy.
# Terminates client connections and forwards everything to the frontend
# container, which itself proxies /api and /uploads to the backend.
#
# This default config serves plain HTTP so `docker compose up --build` works
# immediately without certificates. See DEPLOYMENT.md for how to switch this
# to HTTPS with Let's Encrypt (the config becomes a redirect + SSL server
# block, shown in resolvex-ssl.conf.example in this same folder).

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Used by Certbot's HTTP-01 challenge once SSL is configured
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
